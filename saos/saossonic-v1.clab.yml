name: saos-test

topology:
  defaults:
    env:
      CLAB_MGMT_PASSTHROUGH: False
  nodes:
    sonic-vm-1:
      kind: sonic-vm
      image: vrnetlab/sonic_sonic-vs:202411
    saos-vm-1:
      kind: linux
      image: vrnetlab/ciena_saos:10-10-01-0182
      type: 5132

  links:
    - endpoints: ["sonic-vm-1:eth1", "saos-vm-1:eth1"]
    - endpoints: ["sonic-vm-1:eth2", "saos-vm-1:eth2"]
    - endpoints: ["sonic-vm-1:eth3", "saos-vm-1:eth3"]
    - endpoints: ["sonic-vm-1:eth4", "saos-vm-1:eth4"]

